[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "media-downloader"
dynamic = ["version"]
dependencies = [
    "yt-dlp[default,deno,curl-cffi]==2026.8.19",
    "PySide6-Essentials==6.11.2; platform_system!='Linux'",
    "packaging>=25.0",
    "requests==2.34.2",
    "PGPym==0.6.2"
]

[dependency-groups]
build = [
    "pyinstaller==6.22.2; platform_system!='Linux'",
    "pillow==12.3.0; platform_system=='Windows'",
]
dev = [
    {include-group = "build"},
]

[project.gui-scripts]
media-downloader = "media_downloader:main"

[tool.setuptools.dynamic]
version = { attr = "media_downloader.VERSION" }